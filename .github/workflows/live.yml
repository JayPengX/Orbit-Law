# 立法院 live: which IVOD channel carries each meeting on now (scripts/live-ly.mjs),
# written every 90 seconds in sitting hours to live.json on the `live` branch
# (one commit, replaced each time), which the app reads from
# raw.githubusercontent.com. GitHub runs scheduled workflows late or not at
# all (some days once), so a run watches until 22:00 Taiwan time (5h50m at
# most) and then starts the next itself; the schedule only kicks the day
# off. live.json is rewritten at least every 10 minutes even when nothing
# changed, so the app can tell IVOD's word now from an old one.
name: 立法院 live

on:
  schedule:
    - cron: '0 0-13 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# No concurrency group: cancel-in-progress cancelled the watching run every
# time the hourly schedule fired, and each cancelled run mailed Jay. One
# watcher at a time is kept by the first step instead: a run that finds an
# earlier one still going after a few minutes (the one that started this
# run ends seconds after dispatching it) ends at once, green.
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: One watcher at a time
        id: alone
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 12); do
            older=$(gh api "repos/${{ github.repository }}/actions/workflows/live.yml/runs?status=in_progress&per_page=50" \
              -q '[.workflow_runs[] | select(.id < ${{ github.run_id }})] | length' || echo 0)
            if [ "${older:-0}" = 0 ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            sleep 15
          done
          echo "An earlier run is watching; this one ends here."
          echo "go=false" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.alone.outputs.go == 'true'
        with:
          sparse-checkout: |
            scripts
            public/lib
      - uses: actions/setup-node@v4
        if: steps.alone.outputs.go == 'true'
        with:
          node-version: 22
      - name: Watch IVOD's live list
        if: steps.alone.outputs.go == 'true'
        run: |
          mkdir -p .live
          git fetch -q origin live && git show origin/live:live.json > .live/live.json || true
          # Until 22:00 Taiwan time (14:00 UTC), 5h50m at most.
          left=$(( $(date -u -d '14:00' +%s) - $(date -u +%s) ))
          [ $left -gt 21000 ] && left=21000
          end=$((SECONDS + left))
          last=''
          wrote=0
          while [ $SECONDS -lt $end ]; do
            if node scripts/live-ly.mjs .live/live.json > .live/log.txt; then
              now=$(jq -c '{rooms, places}' .live/live.json)
              if [ "$now" != "$last" ] || [ $((SECONDS - wrote)) -ge 540 ]; then
                [ "$now" != "$last" ] && cat .live/log.txt
                ( cd .live && rm -rf .git && git init -q -b live && git add live.json && git -c user.name='github-actions[bot]' -c user.email='github-actions[bot]@users.noreply.github.com' commit -qm 'live' && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" live ) && last=$now && wrote=$SECONDS
              fi
            fi
            sleep 90
          done
      - name: Keep watching (the next run)
        if: steps.alone.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Still sitting hours on a weekday (Taiwan time): start the next run.
          h=$(TZ=Asia/Taipei date +%H); d=$(TZ=Asia/Taipei date +%u)
          if [ $d -le 5 ] && [ $h -ge 8 ] && [ $h -lt 22 ]; then gh workflow run live.yml --ref main -R ${{ github.repository }}; fi
