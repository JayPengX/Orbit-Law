# Publishes the app to Cloudflare (Orbit-Core deploy/cf-site.mjs) with the newest law data that
# data.yml built and kept in the Actions cache: tests, the data restored, minified, packed,
# published, in a few minutes. On every push to main, and when data.yml has built new data (it
# starts this workflow). The crawling and data building live in data.yml, never here.
name: Deploy to Cloudflare

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  # One deploy at a time, without cancelling any (a cancelled run mails its
  # pusher): a run waits for the earlier ones still going, and steps aside,
  # quietly, when a newer run of this workflow will deploy instead.
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      go: ${{ steps.wait.outputs.go }}
    steps:
      - name: Wait for the earlier deploys; step aside for a newer one
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api() { gh api "repos/$GITHUB_REPOSITORY/$1" --jq "$2" 2>/dev/null; }
          wf=$(api "actions/runs/$GITHUB_RUN_ID" .workflow_id) || wf=
          while [ -n "$wf" ]; do
            runs=$(api "actions/workflows/$wf/runs?branch=$GITHUB_REF_NAME&per_page=30" "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID) | {n: .run_number, done: (.status == \"completed\")}]") || runs='[]'
            if [ "$(jq "[.[] | select(.n > $GITHUB_RUN_NUMBER)] | length" <<<"$runs")" != 0 ]; then
              echo "A newer run deploys instead."; echo go=false >> "$GITHUB_OUTPUT"; exit 0
            fi
            [ "$(jq "[.[] | select(.n < $GITHUB_RUN_NUMBER and (.done | not))] | length" <<<"$runs")" = 0 ] && break
            echo "Waiting for an earlier run to finish."; sleep 20
          done
          echo go=true >> "$GITHUB_OUTPUT"

  build:
    needs: queue
    if: needs.queue.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      # main as it is now, never the commit that started the run: GitHub can
      # deliver a push late (hours, out of order), and an old tree deployed
      # after a newer one would take the live app back.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The shared kit (Orbit-Core/kit), for the tests
        uses: actions/checkout@v4
        with:
          repository: JayPengX/Orbit-Core
          path: .shared
          sparse-checkout: |
            kit
            deploy
      - run: ln -sfn .shared/kit .kit
      - name: Run tests
        run: npm test
      # The newest data data.yml built (unpacked). None kept (the first run, or the cache emptied):
      # nothing is published (quietly: the live site stays), and a data build is asked for, which
      # starts this workflow again when it is done.
      - name: The newest built data
        id: data
        uses: actions/cache/restore@v4
        with:
          path: public/data
          key: law-data-none
          restore-keys: law-data-
      - name: Ask for a data build when none is kept
        if: steps.data.outputs.cache-matched-key == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          busy=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/data.yml/runs?branch=main&per_page=10" --jq '[.workflow_runs[] | select(.status != "completed")] | length' || echo 0)
          [ "$busy" != 0 ] || gh workflow run data.yml --ref main || true
          echo "::warning::No built law data in the cache yet: nothing published; data.yml builds it, then deploys."
      - name: The data published
        if: steps.data.outputs.cache-matched-key != ''
        run: echo "data from ${{ steps.data.outputs.cache-matched-key }}, built $(date -ur public/data/status.json 2>/dev/null || echo '?')"
      # Explanations made ahead with the API credit (Orbit-Core tools/credit/): /law-ask serves them free.
      - name: Add the explanations made ahead
        if: steps.data.outputs.cache-matched-key != ''
        run: mkdir -p public/data/ai && cp -r ai/ruling ai/explain ai/phrases.json public/data/ai/
      - name: Minify, and address every file by its content
        if: steps.data.outputs.cache-matched-key != ''
        # Each script and stylesheet minified and stamped with its own content
        # hash (the kit's kit/stamp-app.mjs): browsers fetch a changed file at
        # once, never mix it with cached older ones, and keep every file the
        # deploy didn't change.
        run: node scripts/stamp-version.mjs "$(git rev-parse HEAD)"
      # The Workers Free plan publishes 20,000 files a site, and the data alone is 77,000: each big
      # folder packed into files of about 96 KB, named by their content (the kit's data-pack.mjs).
      # Last, so every step above sees the files as built.
      - name: Pack the data's small files
        if: steps.data.outputs.cache-matched-key != ''
        run: node scripts/pack-data.mjs
      # The site's files by folder; over 20,000, nothing is published (the deploy would fail half way).
      - name: Count the site's files
        if: steps.data.outputs.cache-matched-key != ''
        run: |
          n=$(find public -type f | wc -l); echo "files: $n"
          find public -type f | awk -F/ '{n=NF-1; if(n>4)n=4; s=$1; for(i=2;i<=n;i++)s=s"/"$i; print s}' | sort | uniq -c | sort -rn | head -60
          [ "$n" -le 20000 ] || { echo "::error::$n files: the Free plan publishes 20,000 at most"; exit 1; }
      # The site on Cloudflare, at its address on the family's domain
      # (Orbit-Core deploy/cf-site.mjs): what phones are served.
      - name: Publish to Cloudflare
        if: steps.data.outputs.cache-matched-key != ''
        run: node .shared/deploy/cf-site.mjs Orbit-Law public
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
