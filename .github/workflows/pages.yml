# Tests, builds the law data (全國法規資料庫 + 立法院 bills, never committed),
# then deploys public/ to GitHub Pages: on every push to main, and once a
# day at 03:30 Taiwan time, after the ministry's midnight refresh. A failed
# build deploys nothing, so the site keeps yesterday's data. Extra runs each
# hour from 00:15 to 05:15 Taiwan time backfill court rulings from 司法院's
# monthly archives (open only then), a few months a run.
# One-time setup: Settings -> Pages -> Source: GitHub Actions.
name: Deploy to Pages

on:
  push:
    branches: ['main']
  schedule:
    - cron: '30 19 * * *'
    - cron: '15 16-21 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The shared kit (Shared-Proxy/kit), for the tests
        uses: actions/checkout@v4
        with:
          repository: JayPengX/Shared-Proxy
          path: .shared
          sparse-checkout: kit
      - run: ln -sfn .shared/kit .kit
      - name: Run tests
        run: npm test
      - name: Build the law data
        run: node scripts/build-data.mjs
      # 立法院: votes by name, each legislator's record and clips, budget bills.
      - name: Build the 立法院 votes, legislators and budgets
        run: node scripts/build-ly.mjs
        continue-on-error: true
      # Ministries' own 行政規則 from their open data, linked to the laws they rest on.
      - name: Build the ministries' rules
        run: node scripts/build-agency.mjs
        continue-on-error: true
      # Court rulings by article: JDoc answers 00:00-06:00 Taiwan time, so the
      # 03:30 run reads it; other runs (and no account yet) carry the last copy.
      - name: An unpacker for the monthly ruling archives (RAR)
        run: command -v unrar || sudo apt-get install -y unrar || sudo apt-get install -y libarchive-tools || true
      - name: Build the court rulings
        run: node scripts/build-rulings.mjs
        env:
          JDOC_USER: ${{ secrets.JDOC_USER }}
          JDOC_PASS: ${{ secrets.JDOC_PASS }}
      # 政府公告 (ministries' RSS) and the hand-kept key figures, for the AI.
      - name: Build the government notices
        run: node scripts/build-news.mjs || echo "notices skipped"
      - name: Cache-bust every script, module and stylesheet
        run: node scripts/stamp-version.mjs ${{ github.sha }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
