# Tests, builds the law data (全國法規資料庫 + 立法院 bills, never committed),
# then deploys public/ to GitHub Pages: on every push to main, and once a
# day at 03:30 Taiwan time, after the ministry's midnight refresh. A failed
# build deploys nothing, so the site keeps yesterday's data. Court rulings
# come from the store rulings.yml fills each night (it asks for a deploy when
# it has read more); 憲法法庭's rulings from its own site on every run.
# One-time setup: Settings -> Pages -> Source: GitHub Actions.
name: Deploy to Pages

on:
  push:
    branches: ['main']
  schedule:
    - cron: '30 19 * * *'
  workflow_dispatch:
    inputs:
      local_from_run:
        description: Build the cities' rules on this earlier run's deploy (its github-pages artifact) instead of the live site
        required: false

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:
  # One deploy at a time, without cancelling any (a cancelled run mails its
  # pusher): a run waits for the earlier ones still going, and steps aside,
  # quietly, when a newer run of this workflow will deploy instead.
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      go: ${{ steps.wait.outputs.go }}
    steps:
      - name: Wait for the earlier deploys; step aside for a newer one
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
          RESTORE: ${{ inputs.local_from_run }}
        run: |
          api() { gh api "repos/$GITHUB_REPOSITORY/$1" --jq "$2" 2>/dev/null; }
          wf=$(api "actions/runs/$GITHUB_RUN_ID" .workflow_id) || wf=
          while [ -n "$wf" ]; do
            runs=$(api "actions/workflows/$wf/runs?branch=$GITHUB_REF_NAME&per_page=30" "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID) | {n: .run_number, done: (.status == \"completed\")}]") || runs='[]'
            # A restore (local_from_run) always builds: a newer run would build on the copy it restores.
            if [ -z "$RESTORE" ] && [ "$(jq "[.[] | select(.n > $GITHUB_RUN_NUMBER)] | length" <<<"$runs")" != 0 ]; then
              echo "A newer run deploys instead."; echo go=false >> "$GITHUB_OUTPUT"; exit 0
            fi
            [ "$(jq "[.[] | select(.n < $GITHUB_RUN_NUMBER and (.done | not))] | length" <<<"$runs")" = 0 ] && break
            echo "Waiting for an earlier run to finish."; sleep 20
          done
          echo go=true >> "$GITHUB_OUTPUT"

  build:
    needs: queue
    if: needs.queue.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      # main as it is now, never the commit that started the run: GitHub can
      # deliver a push late (hours, out of order), and an old tree deployed
      # after a newer one would take the live app back.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The shared kit (Orbit-Core/kit), for the tests
        uses: actions/checkout@v4
        with:
          repository: JayPengX/Orbit-Core
          path: .shared
          sparse-checkout: kit
      - run: ln -sfn .shared/kit .kit
      - name: Run tests
        run: npm test
      # The ministry's last good files, used when it fails on a given day.
      - uses: actions/cache@v4
        with:
          path: .moj-cache
          key: moj-${{ github.run_id }}
          restore-keys: moj-
      - name: Build the law data
        run: node scripts/build-data.mjs
      # 預告 opened up: each draft's record and its text from the 公報 PDF
      # (總說明, 條文對照表), read with poppler's pdftotext.
      - name: Read the drafts open for comment
        run: (command -v pdftotext || sudo apt-get install -y poppler-utils || true) && node scripts/build-notices.mjs
        continue-on-error: true
      # 立法院: votes by name, each legislator's record and clips, budget bills.
      - name: Build the 立法院 votes, legislators and budgets
        run: node scripts/build-ly.mjs
        continue-on-error: true
      # Legislators' headshots, mirrored small (the committed ones, plus a newcomer's).
      - name: Mirror the legislators' photos
        run: (npm i --no-save --no-package-lock sharp@0.33.5 || true) && node scripts/build-photos.mjs
        continue-on-error: true
      # The budgets' money: 主計總處's 預算表 (ws.dgbas.gov.tw leaves its certificate's issuer out).
      - name: Read the budget books
        run: node scripts/build-budget.mjs
        env:
          NODE_EXTRA_CA_CERTS: scripts/twca-ssl.pem
        continue-on-error: true
      # Ministries' own 行政規則 (open data and their rule sites), linked to the
      # laws they rest on. Scheduled runs crawl longer; each run adds to the last.
      # The last build's ministries' and cities' rules (texts and all), kept in the cache: read from
      # there, not fetched file by file from Pages (which answers thousands of reads with 429).
      - uses: actions/cache@v4
        with:
          path: .prev-data
          key: prev-data-${{ github.run_id }}
          restore-keys: prev-data-
      - name: Build the ministries' rules
        run: node scripts/build-agency.mjs --minutes ${{ github.event_name == 'schedule' && 15 || 3 }}
        continue-on-error: true
        env:
          PREV_DIR: .prev-data/
      # Cities' 自治條例, 自治規則 and 行政規則 (臺北市, 新北市, 高雄市, 臺中市, 新竹市, 金門縣),
      # whole text, linked to the laws they rest on. Same budget, same carrying over.
      # A deploy whose cities' data was lost is built on from an earlier run's copy, by hand.
      - uses: actions/download-artifact@v4
        if: inputs.local_from_run != ''
        with:
          name: github-pages
          run-id: ${{ inputs.local_from_run }}
          github-token: ${{ github.token }}
          path: .local-prev
      - if: inputs.local_from_run != ''
        run: tar -xf .local-prev/artifact.tar -C .local-prev ./data/local && ls .local-prev/data/local | head
      - name: Build the cities' rules
        run: node scripts/build-local.mjs --minutes ${{ github.event_name == 'schedule' && 15 || 3 }} ${{ inputs.local_from_run != '' && '--prev .local-prev/data/' || '' }}
        continue-on-error: true
        # The counties that serve only Taiwan are read through the proxy with this key.
        env:
          LAW_BUILD_KEY: ${{ secrets.LAW_BUILD_KEY }}
          PREV_DIR: .prev-data/
      # This build's copy for the next one (the cache saves it when the job ends well); a step that
      # wrote nothing keeps the last copy of its part.
      - name: Keep the ministries' and cities' rules for the next build
        run: |
          for d in agency local; do
            if [ -s "public/data/$d/all.json" ]; then rm -rf ".prev-data/$d" && mkdir -p .prev-data && cp -r "public/data/$d" ".prev-data/$d"; fi
          done
          du -sh .prev-data/* || true
      # Court rulings: made from the rulings store that rulings.yml fills each
      # night (司法院 opens only 00:00-06:00 Taiwan time), restored from the cache.
      - uses: actions/cache/restore@v4
        with:
          path: .rulings-store
          key: rulings-latest
          restore-keys: rulings-
      - name: Build the court rulings
        run: node --max-old-space-size=6144 scripts/build-rulings.mjs
      # 憲法法庭: every 釋字 and 憲判字 from the court's own site (open all day).
      # Each ruling read once and kept in the cache; this year's read again.
      - uses: actions/cache@v4
        with:
          path: .cons-cache
          key: cons-${{ github.run_id }}
          restore-keys: cons-
      - name: Build the constitutional rulings
        run: node scripts/build-cons.mjs --minutes ${{ github.event_name == 'schedule' && 25 || 12 }}
        continue-on-error: true
      # 政府公告 (ministries' RSS) and the hand-kept key figures, for the AI.
      - name: Build the government notices
        run: node scripts/build-news.mjs || echo "notices skipped"
      - name: Minify, and address every file by its content
        # Each script and stylesheet minified and stamped with its own content
        # hash (the kit's kit/stamp-app.mjs): browsers fetch a changed file at
        # once, never mix it with cached older ones, and keep every file the
        # deploy didn't change.
        run: node scripts/stamp-version.mjs "$(git rev-parse HEAD)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.again.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        # A clash with another deploy or a hiccup at GitHub: tried once more.
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - name: Deploy to GitHub Pages (again)
        id: again
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
