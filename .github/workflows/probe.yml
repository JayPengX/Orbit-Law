# Probe: what the proxy's door sees at the pages given (scripts/probe-door.mjs), by hand.
name: Probe the door

on:
  workflow_dispatch:
    inputs:
      urls:
        description: Pages, space separated
        required: true
      certs:
        description: Hosts whose certificate chain to show, space separated
        required: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/probe-door.mjs $URLS
        env:
          URLS: ${{ inputs.urls }}
          LAW_BUILD_KEY: ${{ secrets.LAW_BUILD_KEY }}
      # A host that shows no chain is the answer, not a failed run (no mail).
      - name: Certificate chains
        if: inputs.certs != ''
        run: for h in $CERTS; do echo "== $h"; openssl s_client -connect "$h:443" -servername "$h" -showcerts </dev/null 2>&1 | grep -E '^ *[0-9]+ s:|^ +i:|Verify return|verify error' || echo "(no answer)"; done
        env:
          CERTS: ${{ inputs.certs }}
