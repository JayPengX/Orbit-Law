# The rulings store: every court's judgments that cite a law, from 司法院's
# monthly archives and JDoc, which open only 00:00-06:00 Taiwan time. Each
# run reads for up to 45 minutes, saves the store to the cache, asks data.yml
# for a build (which then deploys), and starts itself again while months remain and the window
# lasts. The store lives only in the cache, so no deploy can empty it.
# GitHub starts a schedule hours late or not at all (11-08 to 11-12: the 00:05,
# 02:05 and 04:05 runs all began between 05:43 and 10:39 Taiwan time, so for days
# none read a month), so it is asked every hour and by data.yml's runs: one landing
# in the five hours before the window waits in `when`, one later ends in seconds,
# touching nothing, and the first that reads chains on by dispatch, which isn't held back.
name: Rulings store

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Read outside 00:00-06:00 Taiwan time (司法院 usually refuses)'
        required: false
        default: ''

permissions:
  contents: read
  actions: write

concurrency:
  group: 'rulings'
  cancel-in-progress: false

jobs:
  # 司法院's doors open 00:00-06:00 Taiwan (16:00-22:00 UTC); a run with under
  # 15 minutes of it left would read nothing, so it doesn't start either. A run
  # landing up to five hours before the doors open waits for them: GitHub ran
  # only 2 of the 18 hourly schedules on 11-12 (23:02 and 05:49 Taiwan), so
  # every run that lands has to count. data.yml's own runs ask here too.
  when:
    runs-on: ubuntu-latest
    timeout-minutes: 310
    outputs:
      open: ${{ steps.w.outputs.open }}
    steps:
      - id: w
        run: |
          m=$(( $(date -u +%-H) * 60 + $(date -u +%-M) ))
          if [ -n "${{ inputs.force }}" ] || { [ $m -ge 960 ] && [ $m -lt 1305 ]; }; then echo "open=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          wait=$(( (960 - m + 1440) % 1440 ))
          if [ $wait -le 300 ]; then echo "司法院 opens in $wait minutes: waiting"; sleep $(( wait * 60 + 60 )); echo "open=1" >> "$GITHUB_OUTPUT"; else echo "outside 司法院 hours: nothing to do"; fi

  backfill:
    needs: when
    if: needs.when.outputs.open == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The law names to read citations by: the live site's index, else built.
      - name: The laws' names
        run: |
          mkdir -p public/data
          curl -sfL -o public/data/index.json https://orbit.jaypengx.com/law/data/index.json && curl -sfL -o public/data/orders.json https://orbit.jaypengx.com/law/data/orders.json || node scripts/build-data.mjs
      - name: An unpacker for the monthly archives (RAR)
        run: command -v unrar || sudo apt-get install -y unrar || sudo apt-get install -y libarchive-tools || true
      - uses: actions/cache/restore@v4
        with:
          path: .rulings-store
          key: rulings-latest
          restore-keys: rulings-
      - name: Read the courts
        id: read
        run: |
          node --max-old-space-size=6144 scripts/backfill-rulings.mjs --minutes 45 ${{ inputs.force && '--force 1' || '' }} | tee backfill.log
          grep -q '^more=1' backfill.log && echo "more=1" >> "$GITHUB_OUTPUT" || true
          grep -q 'citing a law' backfill.log && echo "read=1" >> "$GITHUB_OUTPUT" || true
        env:
          JDOC_USER: ${{ secrets.JDOC_USER }}
          JDOC_PASS: ${{ secrets.JDOC_PASS }}
          # (Read from Taiwan through the proxy's /law-judicial: 司法院 turns GitHub's runners away.)
          LAW_BUILD_KEY: ${{ secrets.LAW_BUILD_KEY }}
      - uses: actions/cache/save@v4
        if: always() && hashFiles('.rulings-store/done.json') != ''
        with:
          path: .rulings-store
          key: rulings-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy what was read
        if: steps.read.outputs.read == '1'
        run: gh workflow run data.yml --ref main -f crawl=0
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Read on while months remain tonight
        if: steps.read.outputs.more == '1'
        run: gh workflow run rulings.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
